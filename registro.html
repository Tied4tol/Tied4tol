<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div class="container">
    <h1>Crear Cuenta</h1>

    <input type="text" id="nombre"

    <button onclick="registrar()">
        Registrarse
    </button>
</div>

<script src="js/auth.js"></script>

</body>
</html>
