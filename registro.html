<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <h1>Crear Cuenta</h1>

    <!-- CORRECCIÓN: faltaba este <div> de apertura -->
    <div>

        <input type="text"
               id="nombre"
               placeholder="Nombre completo">

        <input type="date"
               id="fechaNacimiento">

        <input type="email"
               id="correo"
               placeholder="Correo">

        <input type="password"
               id="password"
               placeholder="Contraseña">

        <button onclick="registrar()">
            Registrarse
        </button>

    </div>

    <script src="js/auth.js"></script>

</body>
</html>
